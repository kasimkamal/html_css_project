name: test → Main pipeline

on:
  push:
    branches:
      - test

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-test-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR to main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync from dev → main"
          branch: "chore/sync-dev-to-main"
          base: "main"
          title: "Sync changes from dev to main"
          body: |
            Auto-generated PR from dev branch.
          labels: "automerge"